# VisionAudioForge — full local stack.
#
# `docker compose up --build` from a clean clone must produce a working system
# with no manual setup. That means: no hand-written .env required, migrations
# applied, and the object store bucket created. Every default below is a
# development default; see .env.example to override, and
# docker-compose.prod.yml for deployment.

# Backend settings shared by api, celery_worker and the migration job.
# These names are the fields on `Settings` in backend/app/config.py, which is
# case-sensitive — a near-miss like JWT_SECRET is silently ignored.
x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-vaf}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  POSTGRES_DB: ${POSTGRES_DB:-vaf}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-vaf-assets}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-do-not-deploy}
  AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
  # Deliberately allowed to be empty: the copilot degrades to mock mode and
  # the API must still start. Regression-tested by the compose smoke job.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}

# `required: false` is what lets the stack start without a .env. Without it
# compose refuses to even parse this file on a clean clone.
x-env-file: &env-file
  - path: .env
    required: false

services:
  db:
    # pgvector/pgvector, not postgres:16-alpine. scripts/init-db.sql runs
    # CREATE EXTENSION vector, which stock Postgres cannot satisfy — the init
    # script errored and the container exited before it ever served a query.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaf}
      POSTGRES_USER: ${POSTGRES_USER:-vaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # -d as well as -U: pg_isready without a database name reports ready
      # while the init scripts are still running.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaf} -d ${POSTGRES_DB:-vaf}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      # The image ships no curl. `mc ready local` is the vendor's documented
      # probe and is present in the image.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot: create the application bucket. Without this the API starts but
  # every asset write fails against a bucket that does not exist.
  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vaf-assets}
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    restart: "no"

  # One-shot: bring the schema up to head before anything talks to the
  # database. Six migrations existed and nothing ever ran them.
  migrate:
    image: vaf-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    env_file: *env-file
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: vaf-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host ports are overridable: this repo is developed in several
      # worktrees at once and shares a machine with other stacks, so fixed
      # host ports collide. Container ports never change.
      - "${API_PORT:-8000}:8000"
    environment: *backend-env
    env_file: *env-file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: vaf-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time — Next inlines NEXT_PUBLIC_* into the client
        # bundle, so setting it only at runtime has no effect. Empty means
        # "same origin", which is what nginx serves.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # /login rather than /: the dashboard redirects anonymous visitors, and
      # a probe that follows redirects is a probe that tests two things.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # Waiting for *healthy*, not just started: nginx resolves its upstreams
      # at startup and exits with "host not found in upstream" if they are not
      # up yet.
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  celery_worker:
    image: vaf-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "--concurrency=2"]
    environment: *backend-env
    env_file: *env-file
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
