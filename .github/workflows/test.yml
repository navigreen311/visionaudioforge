name: Test Suite

on: [push, pull_request]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vaf_test
          POSTGRES_USER: vaf
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: vaf
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vaf_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: test-secret-key
          SECRET_KEY: test-secret-key
          APP_ENV: test

  frontend:
    name: Frontend (lint, types, build, test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 LTS: jsdom 30 pulls an undici that needs webidl APIs missing from
          # the Node 20 line, so vitest workers fail to start there.
          node-version: "22"
          # Caches the npm download cache and keys off the lockfile, which is
          # what makes `npm ci` fast; node_modules itself is not cacheable
          # across runs because npm ci deletes it.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  compose-smoke:
    name: Compose smoke (stack boots)
    runs-on: ubuntu-latest
    # Blocking by design: this job is what stands between a broken compose file
    # and a repository that claims a seven-service platform. Add it to the
    # branch protection required checks alongside `backend` and `frontend`.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The backend image carries torch, faiss, transformers and ffmpeg.
      # A GitHub-hosted runner starts with ~14 GB free, which is not enough
      # headroom once the frontend image and the four pulled images land too.
      - name: Reclaim runner disk
        run: |
          echo "before: $(df -h / | awk 'NR==2 {print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          echo "after:  $(df -h / | awk 'NR==2 {print $4}') free"

      - uses: docker/setup-buildx-action@v3

      # Built here rather than by the smoke script so the layer cache applies.
      # Without it every push pays the full torch install; with it an unchanged
      # requirements.txt is a cache hit.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: vaf-backend:local
          load: true
          cache-from: type=gha,scope=vaf-backend
          cache-to: type=gha,mode=max,scope=vaf-backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: vaf-frontend:local
          load: true
          cache-from: type=gha,scope=vaf-frontend
          cache-to: type=gha,mode=max,scope=vaf-frontend

      - name: Smoke the stack
        env:
          # Images are already built and loaded above; rebuilding inside the
          # script would discard the cache we just populated.
          SMOKE_NO_BUILD: "1"
          # No ANTHROPIC_API_KEY on purpose — the copilot must degrade to mock
          # mode rather than take the API container down. The script asserts
          # the variable is genuinely absent.
          WAIT_TIMEOUT: "600"
        run: ./scripts/smoke-stack.sh --down

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200 || true
