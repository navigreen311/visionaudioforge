name: Test Suite

on: [push, pull_request]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vaf_test
          POSTGRES_USER: vaf
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      # The Postgres service container starts empty. Without this the schema
      # never exists and every DB-backed test dies on `relation "..." does not
      # exist` — which is what hid ~139 failures behind a green-looking config.
      # Running the real migrations here also means CI exercises them.
      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: vaf
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vaf_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: test-secret-key
          SECRET_KEY: test-secret-key
          APP_ENV: test

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: vaf
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vaf_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: test-secret-key
          SECRET_KEY: test-secret-key
          APP_ENV: test

  frontend:
    name: Frontend (lint, types, build, test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 LTS: jsdom 30 pulls an undici that needs webidl APIs missing from
          # the Node 20 line, so vitest workers fail to start there.
          node-version: "22"
          # Caches the npm download cache and keys off the lockfile, which is
          # what makes `npm ci` fast; node_modules itself is not cacheable
          # across runs because npm ci deletes it.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
