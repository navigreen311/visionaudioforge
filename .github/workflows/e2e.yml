name: Browser E2E

# A separate workflow from Test Suite on purpose: this one drives a real browser
# against the full compose stack, which is slower and fails for different reasons
# than a unit suite. Keeping it separate means a flaky browser run never hides a
# genuine unit-test regression, and the two can be required independently in
# branch protection.
on: [push, pull_request]

jobs:
  e2e:
    name: E2E (chromium against the compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The backend image carries torch, faiss, transformers and ffmpeg. A
      # GitHub-hosted runner does not have the headroom for that plus the
      # frontend image and four pulled images without this.
      - name: Reclaim runner disk
        run: |
          echo "before: $(df -h / | awk 'NR==2 {print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          echo "after:  $(df -h / | awk 'NR==2 {print $4}') free"

      - uses: docker/setup-buildx-action@v3

      # Same cache scopes as the compose-smoke job in test.yml, so the two share
      # layers instead of each paying for a full torch install.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: vaf-backend:local
          load: true
          cache-from: type=gha,scope=vaf-backend
          cache-to: type=gha,mode=max,scope=vaf-backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: vaf-frontend:local
          load: true
          cache-from: type=gha,scope=vaf-frontend
          cache-to: type=gha,mode=max,scope=vaf-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suite
        env:
          # Images are built and loaded above; rebuilding in the script would
          # discard the cache.
          SMOKE_NO_BUILD: "1"
          WAIT_TIMEOUT: "600"
          # No ANTHROPIC_API_KEY on purpose: the copilot must degrade to mock
          # mode rather than take the API container down.
          HTTP_PORT: "8080"
          FRONTEND_PORT: "3001"
        run: ./scripts/e2e.sh --down

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200 || true
