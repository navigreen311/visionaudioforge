events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker's embedded DNS. Combined with the variables below this makes nginx
    # re-resolve upstreams instead of caching the IP it saw at startup — without
    # it, restarting the api container leaves nginx 502-ing forever against an
    # address nothing is listening on.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # Real client IP for the API's audit log and rate limiter, which read
    # X-Forwarded-For.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 500M;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The previous policy was `default-src 'self'`, which blocks every
        # inline script and style Next.js emits — the console would render
        # blank through nginx while working fine on :3000 directly.
        #
        # 'unsafe-inline' on script-src is what a Next app without nonce
        # plumbing requires; tightening it means threading a nonce through the
        # document, which is a frontend change and not this workstream's to
        # make. connect-src includes ws/wss for the live capture and copilot
        # sockets.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'none'" always;

        # No HSTS here on purpose: this server is plain HTTP. Browsers ignore
        # the header over HTTP anyway, and emitting it invites a copy-paste
        # into a TLS terminator that then pins localhost to https for a year.
        # docker-compose.prod.yml is where HSTS belongs.

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
        }

        location /api {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            # Model inference and large uploads outlast the 60s default.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws {
            set $ws_upstream http://api:8000;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Authorization rides through by default, and the ?token= query
            # parameter travels with the request URI. Both handshake styles the
            # backend accepts therefore survive the proxy — see docs/auth.md.
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }
    }
}
