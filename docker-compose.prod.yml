# VisionAudioForge — production stack.
#
# Differences from docker-compose.yml: resource limits, segmented networks,
# multiple uvicorn workers, and a REQUIRED .env (production must be configured
# explicitly; there are no safe defaults for secrets).
#
# STATUS: the defects fixed here were found by booting docker-compose.yml and
# are corrected by inspection. This file has not itself been booted end to end —
# doing so needs real secrets and a TLS terminator. Treat a first production
# deploy as unverified and run `scripts/smoke-stack.sh` against it.

# Application settings. These names are the fields on `Settings` in
# backend/app/config.py, which is case-sensitive. Values come from .env.
x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-vaf}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
  POSTGRES_DB: ${POSTGRES_DB:-vaf}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
  MINIO_BUCKET: ${MINIO_BUCKET:-vaf-assets}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # `:?` deliberately: a production stack must refuse to start rather than sign
  # tokens with the default secret published in this repository.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set for production}
  AUTH_REQUIRED: "true"
  DEBUG_ERRORS: "false"
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for production}

services:
  # One-shot: bring the schema to head before anything serves traffic. The
  # production stack had no migration step at all — deploy.md told operators to
  # run alembic by hand, so a forgotten step meant an API against a stale schema.
  migrate:
    image: vaf-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-net
      - data-net

  # One-shot: create the bucket. Without it every asset write fails against a
  # bucket that does not exist.
  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
      MINIO_BUCKET: ${MINIO_BUCKET:-vaf-assets}
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    restart: "no"
    networks:
      - data-net

  api:
    image: vaf-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio_init:
        condition: service_completed_successfully
    environment: *backend-env
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  frontend:
    image: vaf-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vaf
      POSTGRES_USER: vaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaf} -d ${POSTGRES_DB:-vaf}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
    networks:
      - data-net
      - backend-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped
    networks:
      - data-net
      - backend-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    networks:
      - data-net
      - backend-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    networks:
      - frontend-net

  celery_worker:
    image: vaf-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -l info --concurrency 4
    environment: *backend-env
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
    networks:
      - backend-net
      - data-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge
